<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safety Banner</title>
<!--
  Separate OBS browser source, deliberately static: no scripts, no network, no fonts to
  fetch. Nothing the puppet or orchestrator does can take it down.
  Suggested OBS source size: 1920x1080, or crop to the top 120px.
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
  .banner {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 30px;
    white-space: nowrap;
    color: #fbeee0;
    background: #1f2440;
    border: 4px solid #f2b33d;
    border-radius: 999px;
    box-shadow: 0 5px 0 #15131c;
    font: 700 30px/1.2 "Arial Rounded MT Bold", "Trebuchet MS", "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
    letter-spacing: 0.01em;
  }
  .age {
    padding: 2px 12px;
    color: #1f2440;
    background: #f2b33d;
    border-radius: 10px;
  }
  .dot {
    color: #f2b33d;
  }
</style>
</head>
<body>
  <div class="banner" role="note" aria-label="18+. Gamble responsibly. Demo mode, no real money.">
    <span class="age">18+</span>
    <span class="dot">·</span>
    <span>Gamble responsibly</span>
    <span class="dot">·</span>
    <span>Demo mode, no real money</span>
  </div>
</body>
</html>
