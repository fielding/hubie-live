<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hubie HUD</title>
<meta name="viewport" content="width=1920, height=1080">
<!--
  Stream HUD: autonomy uptime, chat, session stats and game vote. Separate OBS browser
  source (1920x1080, transparent) so a bug here can't take the puppet or banner down.

  Data arrives over ws://127.0.0.1:8767 (override with ?ws=) from the show runner;
  ?demo=1 plays made-up data instead. Every message is validated; chat text is only ever
  set with textContent.

    {"type": "chat", "user": "name", "text": "...", "answering": true}
    {"type": "stats", "game": "MINES", "rounds": 12, "best": 41.6, "streak": 3, "balance": 1240}
    {"type": "vote", "options": [{"cmd": "!mines", "votes": 12}, ...], "ends_in": 45}
    {"type": "autonomy", "since": 1793990000000}     // epoch ms of the last human touch
    {"type": "follow", "user": "name"}               // user null + count n: unnamed follows
-->
<style>
  :root { --navy: #1f2440; --gold: #f2b33d; --cream: #fbeee0; --ink: #15131c; --cyan: #3ee6ff; --magenta: #de3cff; --green: #39e27d; --red: #ff4d6d; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: "Arial Rounded MT Bold", "Trebuchet MS", "DejaVu Sans", "Liberation Sans", Arial, sans-serif; color: var(--cream); }
  .card {
    position: absolute; box-sizing: border-box; background: rgba(31, 36, 64, 0.94);
    border: 4px solid var(--gold); border-radius: 22px;
    box-shadow: 0 6px 0 var(--ink), 0 0 34px rgba(222, 60, 255, 0.25);
  }
  .label { color: var(--gold); font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }

  /* Autonomy uptime */
  #autonomy { left: 30px; top: 30px; width: 720px; height: 92px; display: flex; align-items: center; gap: 18px; padding: 0 26px; }
  #autonomy .pulse { width: 16px; height: 16px; border-radius: 50%; background: var(--green); box-shadow: 0 0 16px var(--green); animation: pulse 2s ease-in-out infinite; }
  #autonomy .clock { font-size: 40px; font-weight: 800; color: var(--cream); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  #autonomy .unit { color: var(--gold); font-size: 24px; margin: 0 6px 0 2px; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* Chat */
  #chat { left: 30px; top: 142px; width: 720px; height: 440px; padding: 18px 22px; overflow: hidden; display: flex; flex-direction: column; }
  #chat .msgs { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 34px); mask-image: linear-gradient(to bottom, transparent 0, #000 34px); flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; overflow: hidden; margin-top: 10px; }
  .msg { font-size: 25px; line-height: 1.3; overflow-wrap: anywhere; animation: slide 0.25s ease-out; }
  .msg .user { font-weight: 800; margin-right: 10px; }
  .msg.answering { background: rgba(242, 179, 61, 0.14); border-left: 5px solid var(--gold); border-radius: 10px; padding: 6px 12px; }
  .msg.answering::before { content: "Hubie is answering"; display: block; color: var(--gold); font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2px; }
  @keyframes slide { from { transform: translateY(10px); opacity: 0; } }

  /* Session stats (under the game) */
  #stats { left: 800px; top: 858px; width: 1080px; height: 92px; display: flex; align-items: center; padding: 0 28px; gap: 34px; }
  #stats .game { color: var(--gold); font-size: 44px; font-weight: 800; letter-spacing: 0.06em; text-shadow: 0 3px 0 var(--ink); margin-right: 8px; }
  #stats .stat { display: flex; flex-direction: column; }
  #stats .val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #stats .val.win { color: var(--green); }
  #stats .val.loss { color: var(--red); }

  /* Vote */
  #vote { left: 800px; top: 968px; width: 1080px; height: 86px; display: flex; align-items: center; padding: 0 26px; gap: 20px; border-color: var(--cyan); box-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(62, 230, 255, 0.25); }
  #vote .prompt { font-size: 22px; font-weight: 800; white-space: nowrap; }
  #vote .opts { flex: 1; display: flex; gap: 12px; }
  .opt { flex: 1; position: relative; height: 48px; border-radius: 12px; background: rgba(21, 19, 28, 0.7); overflow: hidden; border: 2px solid rgba(62, 230, 255, 0.45); }
  .opt .bar { position: absolute; inset: 0 auto 0 0; background: rgba(62, 230, 255, 0.28); transition: width 0.6s ease; }
  .opt .cmd { position: absolute; left: 12px; top: 10px; font-size: 22px; font-weight: 800; color: var(--cyan); }
  .opt .pct { position: absolute; right: 12px; top: 12px; font-size: 19px; font-variant-numeric: tabular-nums; }
  #vote .timer { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--gold); white-space: nowrap; }

  /* layout=room: no cards of our own; live text sits inside the room art's frames
     (chat panel windows, console strip). Coordinates match stage/live.html. */
  body.room .card { background: none; border: none; box-shadow: none; border-radius: 0; }
  body.room #autonomy { left: 488px; top: 49px; width: 264px; height: 74px; padding: 0 10px; gap: 10px; }
  body.room #autonomy .label { font-size: 11px; }
  body.room #autonomy .clock { font-size: 27px; }
  body.room #autonomy .unit { font-size: 16px; }
  body.room .rt-ico, body.room .rt-ico .ico { width: 30px; height: 30px; }
  body.room #chat { left: 491px; top: 147px; width: 264px; height: 300px; padding: 6px 10px; }   /* ends above the corner stripes */
  body.room #chat > .label { font-size: 11px; }
  body.room .msg { font-size: 13.5px; line-height: 1.3; }
  /* Messages start right under the header and flow down; the oldest drop off when full. */
  body.room #chat .msgs { justify-content: flex-start; margin-top: 6px; -webkit-mask-image: none; mask-image: none; }
  /* Quieter in the room: a gold edge and a small tag, no big label. */
  body.room .msg.answering { padding: 2px 0 2px 8px; background: rgba(242, 179, 61, 0.08); border-left-width: 3px; border-radius: 6px; }
  body.room .msg.answering::before { content: "answering"; display: inline; font-size: 9px; margin-right: 6px; vertical-align: 1px;
                                     padding: 1px 5px; border-radius: 4px; background: rgba(242, 179, 61, 0.2); }
  /* Commands get their own box on the console, under the stats strip. */
  body.room #vote { left: 1150px; top: 858px; width: 530px; height: 94px; padding: 10px 16px; gap: 8px; flex-wrap: wrap;
                    align-content: flex-start; background: rgba(12, 11, 24, 0.82); border: 2px solid rgba(62, 230, 255, 0.45);
                    border-radius: 14px; box-shadow: 0 0 22px rgba(62, 230, 255, 0.18); }
  body.room #vote .prompt { display: none; }
  body.room #vote .opts { gap: 8px; }
  body.room .opt { height: 40px; border-radius: 9px; }
  body.room .opt .cmd { font-size: 17px; left: 0; right: 0; top: 9px; text-align: center; }
  body.room .opt .pct { display: none; }   /* the fill bar carries the share */
  body.room #vote .timer { font-size: 13px; width: 56px; text-align: right; align-self: center; }
  body.room #stats { left: 860px; top: 763px; width: 998px; height: 62px; padding: 0 22px; gap: 30px; }
  body.room #stats .game { font-size: 32px; color: #de3cff; text-shadow: 0 0 14px rgba(222, 60, 255, 0.55); }
  body.room #stats .stat { flex-direction: row; align-items: baseline; gap: 10px; }
  body.room #stats .label { font-size: 13px; white-space: nowrap; }
  body.room #stats .val { font-size: 26px; }
  body.room #live { display: flex; }
  #live { display: none; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; letter-spacing: 0.04em; }
  #live .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--green); box-shadow: 0 0 14px var(--green); animation: pulse 2s ease-in-out infinite; }
  .room-only { display: none; }
  body.room .room-only { display: inline-flex; }
  body.room .default-only { display: none; }
  .ico { width: 1.25em; height: 1.25em; vertical-align: -0.25em; margin-right: 0.45em; }
  body.room #chat > .label { display: flex; align-items: center; color: var(--cream); }
  body.room #chat > .label .ico { color: var(--magenta); }
  body.room #chat > .label .viewers { margin-left: auto; color: var(--cream); letter-spacing: 0.06em; white-space: nowrap; }
  body.room #chat > .label .viewers:not(:empty)::before { content: ""; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: #ff3b5c; box-shadow: 0 0 6px #ff3b5c; margin-right: 6px; vertical-align: 1px; }
  body.room .rt-ico { color: var(--cyan); width: 34px; height: 34px; }
  body.room .rt-ico .ico { width: 34px; height: 34px; margin: 0; }
  body.room #autonomy .pulse { display: none; }
  body.room #autonomy .label { color: var(--cyan); }
  body.room #vote .cmdhead { width: 100%; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
  body.room .auto { flex-direction: column; white-space: nowrap; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.35;
                    padding: 0 22px; border-left: 2px solid rgba(251, 238, 224, .25); border-right: 2px solid rgba(251, 238, 224, .25); }
  body.room #stats { gap: 14px; padding: 0 16px; }
  body.room #stats .game { font-size: 26px; }
  body.room #stats .val { font-size: 22px; }
  body.room #stats .label { font-size: 12px; }
  body.room #live { font-size: 24px; }
  /* Room layout: no separate commands box for now; a one-line vote hint closes the chat panel. */
  body.room #vote { display: none; }
  body.room .cmdline { display: block; margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(62, 230, 255, 0.3);
                       font-size: 12px; color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.room .cmdline b { color: var(--cream); font-weight: 800; }
  .votetag { margin-left: 6px; padding: 0 5px; border-radius: 4px; background: rgba(62, 230, 255, 0.18);
             color: var(--cyan); font-size: 9px; font-weight: 800; letter-spacing: 0.08em; vertical-align: 1px; }
  /* New-follower alert: drops in over the top of the game for a few seconds. */
  #follow { position: absolute; left: 1301px; top: 104px; transform: translate(-50%, -160%); opacity: 0;
            display: flex; align-items: center; gap: 16px; padding: 14px 30px 14px 20px; white-space: nowrap;
            background: rgba(12, 11, 24, 0.94); border: 3px solid var(--magenta); border-radius: 18px;
            box-shadow: 0 6px 0 var(--ink), 0 0 36px rgba(222, 60, 255, 0.55);
            transition: transform 0.45s cubic-bezier(.2, 1.4, .4, 1), opacity 0.3s; }
  #follow.show { transform: translate(-50%, 0); opacity: 1; }
  #follow .heart { width: 44px; height: 44px; color: var(--magenta); filter: drop-shadow(0 0 10px rgba(222, 60, 255, .8)); animation: beat 0.9s ease-in-out infinite; }
  #follow .kicker { font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--magenta); font-weight: 800; }
  #follow .who { font-size: 34px; font-weight: 800; color: var(--cream); max-width: 640px; overflow: hidden; text-overflow: ellipsis; }
  @keyframes beat { 15% { transform: scale(1.18); } 30% { transform: scale(1); } }
</style>
</head>
<body>
  <div id="autonomy" class="card">
    <span class="pulse"></span>
    <span class="room-only rt-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6M19 6l-1.5 1.5"/></svg></span>
    <div>
      <div class="label"><span class="default-only">Fully autonomous · no human input for</span><span class="room-only">Stream runtime</span></div>
      <div class="clock" id="clock">-</div>
    </div>
  </div>
  <div id="chat" class="card"><div class="label"><span class="room-only"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg></span><span class="default-only">Chat</span><span class="room-only">Chat</span><span class="room-only viewers" id="viewers"></span></div><div class="msgs" id="msgs"></div><div class="room-only cmdline" id="cmdline"></div></div>
  <div id="stats" class="card">
    <span id="live"><span class="dot"></span>LIVE</span>
    <span class="room-only auto"><span>Fully autonomous</span><span>No human input</span></span>
    <span class="game" id="s-game">MINES</span>
    <div class="stat"><span class="label">Rounds</span><span class="val" id="s-rounds">0</span></div>
    <div class="stat"><span class="label">Best</span><span class="val win" id="s-best">-</span></div>
    <div class="stat"><span class="label">Streak</span><span class="val" id="s-streak">-</span></div>
    <div class="stat" id="s-ladder-box" style="display:none"><span class="label">Auto bet</span><span class="val win" id="s-ladder">-</span></div>
    <div class="stat"><span class="label"><span class="default-only">Demo balance</span><span class="room-only">Balance</span></span><span class="val" id="s-balance">-</span></div>
  </div>
  <div id="vote" class="card">
    <span class="room-only cmdhead">&gt;_ Commands</span>
    <span class="prompt">Vote the next game:</span>
    <div class="opts" id="opts"></div>
    <span class="timer" id="v-timer"></span>
  </div>
  <div id="follow"><svg class="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    <div><div class="kicker">New follower</div><div class="who" id="follow-who"></div></div></div>
<script src="hud.js"></script>
</body>
</html>
