<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hubie Game View</title>
<!-- One OBS source for every game: renderers switch when the show runner switches games.
     Connects to ws://127.0.0.1:8766 (override with ?ws=). Transparent outside the card. -->
<style>
  :root { --bg: #14122a; --panel: #1c1a38; --tile: #26234a; --line: #3a3566; --cream: #fbeee0; --gold: #f2b33d;
          --cyan: #3ee6ff; --magenta: #de3cff; --green: #39e27d; --red: #ff4d6d; --ink: #0c0b18; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Arial Rounded MT Bold", "Trebuchet MS", "DejaVu Sans", "Liberation Sans", Arial, sans-serif; color: var(--cream); }
  #card { position: absolute; inset: 0; display: flex; gap: 24px; padding: 22px; box-sizing: border-box; background: var(--bg); }
  .side { width: 260px; display: flex; flex-direction: column; gap: 14px; }
  .box { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 14px 18px; }
  .k { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); opacity: 0.9; }
  .v { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .v.green { color: var(--green); } .v.red { color: var(--red); } .v.cyan { color: var(--cyan); }
  .fair { margin-top: auto; font-size: 13px; opacity: 0.55; overflow-wrap: anywhere; line-height: 1.35; }
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  /* Mines */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; height: min(100%, 600px); aspect-ratio: 1; max-width: 100%; }
  .tile { background: var(--tile); border: 2px solid var(--line); border-radius: 14px; display: flex; align-items: center; justify-content: center; transition: transform .15s; }
  .tile svg { width: 64%; height: 64%; }
  .tile.gem { background: #1f3a37; border-color: var(--green); box-shadow: 0 0 16px rgba(57, 226, 125, .35); animation: pop .3s ease-out; }
  .tile.mine { background: #3a1f2a; border-color: var(--red); }
  .tile.hit { box-shadow: 0 0 30px var(--red); animation: shake .4s; }
  .tile.dim { opacity: .45; }
  .popup { position: absolute; padding: 18px 34px; border-radius: 18px; background: var(--ink); border: 3px solid var(--gold);
           text-align: center; box-shadow: 0 0 40px rgba(242, 179, 61, .45); animation: pop .3s ease-out; }
  .popup .big { font-size: 64px; font-weight: 800; color: var(--gold); }
  .popup.bust { border-color: var(--red); box-shadow: 0 0 40px rgba(255, 77, 109, .45); }
  .popup.bust .big { color: var(--red); }
  /* Dice */
  .dice { width: 100%; max-width: 640px; text-align: center; }
  .roll { font-size: 150px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .track { position: relative; height: 26px; border-radius: 13px; background: var(--red); margin: 34px 0 12px; overflow: hidden; border: 2px solid var(--line); }
  .zone { position: absolute; top: 0; bottom: 0; background: var(--green); }
  .marker { position: absolute; top: -10px; width: 6px; height: 46px; background: var(--cream); border-radius: 3px; transition: left .6s cubic-bezier(.2, .8, .2, 1); }
  .ticks { display: flex; justify-content: space-between; opacity: .6; font-size: 18px; }
  .waiting { font-size: 40px; opacity: .6; text-align: center; }
  /* Game switch card: sits over everything for a few seconds. */
  #switch { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(12, 11, 24, 0.78); z-index: 5; }
  #switch.on { display: flex; animation: fadeout 3.4s ease-in forwards; }
  #switch .inner { text-align: center; padding: 26px 60px; border-radius: 22px; background: var(--ink);
                   border: 3px solid var(--magenta); box-shadow: 0 0 50px rgba(222, 60, 255, .5); animation: pop .35s ease-out; }
  #switch .why { font-size: 20px; letter-spacing: .3em; color: var(--cyan); }
  #switch .what { font-size: 86px; font-weight: 800; letter-spacing: .06em; color: var(--gold); line-height: 1.1;
                  text-shadow: 0 0 24px rgba(242, 179, 61, .5); }
  #switch .votes { font-size: 20px; opacity: .8; }
  /* Segment: an ad or promo image over the game for a few seconds. */
  /* "Be right back": covers the monitor while the real site's game is down (it's an empty dark box
     then), until play resumes. */
  #offline { position: absolute; inset: 0; display: none; z-index: 7; align-items: center; justify-content: center;
             background: radial-gradient(ellipse at center, #1f1b42 0%, var(--ink) 75%); }
  #offline.on { display: flex; animation: pop .3s ease-out; }
  #offline .inner { text-align: center; padding: 28px 56px; border-radius: 22px; border: 3px solid var(--magenta);
                    background: rgba(12, 11, 24, .85); box-shadow: 0 0 40px rgba(222, 60, 255, .35); }
  #offline .tag { font-size: 18px; letter-spacing: .32em; color: var(--magenta); }
  #offline .big { font-size: 64px; font-weight: 800; color: var(--gold); letter-spacing: .04em; line-height: 1.15; margin: 6px 0; }
  #offline .sub { font-size: 22px; opacity: .85; }
  #offline .dots span { display: inline-block; animation: blink 1.4s infinite both; }
  #offline .dots span:nth-child(2) { animation-delay: .2s; } #offline .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  #segment { position: absolute; inset: 0; display: none; z-index: 6; background: var(--bg); }
  #segment.on { display: block; animation: pop .3s ease-out; }
  #segment img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes fadeout { 0%, 82% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop { from { transform: scale(.6); opacity: .2; } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>
<body>
<div id="segment"><img alt=""></div>
<div id="offline"><div class="inner"><div class="tag">HOUSEBETS IS LAGGING</div>
  <div class="big">BE RIGHT BACK<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="sub">Hubie's still here. The game will be back in a sec.</div></div></div>
<div id="switch"><div class="inner"><div class="why"></div><div class="what"></div><div class="votes"></div></div></div>
<div id="card"><div class="main"><div class="waiting">waiting for the show runner…</div></div></div>
<script src="view.js"></script>
</body>
</html>
